<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OLL RoboRacer</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141a24; --panel2:#1b2331; --text:#e8edf5;
    --muted:#8794a8; --accent:#00e5ff; --danger:#ff3b4e; --ok:#2ee66b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:none;}
  .wrap{max-width:560px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:100%;}
  header{display:flex;align-items:center;justify-content:space-between;}
  h1{font-size:1.3rem;margin:0;letter-spacing:2px;}
  h1 span{color:var(--accent);}
  .status{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--danger);box-shadow:0 0 8px var(--danger);}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok);}
  .error{display:none;background:#3a1219;border:1px solid var(--danger);color:#ffb3bb;
    padding:8px 12px;border-radius:10px;font-size:.85rem;}
  .error.show{display:block;}
  .panel{background:var(--panel);border-radius:18px;padding:16px;}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    gap:10px;aspect-ratio:1/1;width:100%;max-width:420px;margin:0 auto;}
  .btn{border:2px solid #263145;background:var(--panel2);color:var(--text);border-radius:18px;
    font-size:2.6rem;display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:transform .05s,background .1s,border-color .1s,box-shadow .1s;touch-action:none;}
  .btn.active{background:var(--accent);color:#001318;border-color:var(--accent);
    box-shadow:0 0 18px var(--accent);transform:scale(.96);}
  #fwd{grid-column:2;grid-row:1;} #lft{grid-column:1;grid-row:2;}
  #stp{grid-column:2;grid-row:2;background:var(--danger);border-color:var(--danger);
    font-size:1.1rem;font-weight:800;letter-spacing:1px;color:#fff;}
  #stp:active{transform:scale(.94);box-shadow:0 0 18px var(--danger);}
  #rgt{grid-column:3;grid-row:2;} #bwd{grid-column:2;grid-row:3;}
  .speedhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .speedhead label{color:var(--muted);font-size:.85rem;letter-spacing:1px;}
  #speedVal{font-size:2rem;font-weight:800;color:var(--accent);}
  input[type=range]{width:100%;height:36px;accent-color:var(--accent);touch-action:pan-x;}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;}
  .preset{padding:14px 0;border-radius:12px;border:2px solid #263145;background:var(--panel2);
    color:var(--text);font-weight:700;font-size:1rem;cursor:pointer;}
  .preset.sel{border-color:var(--accent);color:var(--accent);}
  @media (min-width:700px){.wrap{max-width:640px;} .btn{font-size:3rem;}}
  @media (max-height:640px) and (orientation:landscape){
    .wrap{max-width:900px;display:grid;grid-template-columns:1fr 1fr;align-items:start;}
    header,.error{grid-column:1/3;} .pad{max-width:300px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>OLL <span>ROBORACER</span></h1>
    <div class="status"><div id="dot" class="dot"></div><span id="stText">Connecting...</span></div>
  </header>

  <div id="err" class="error"></div>

  <div class="panel">
    <div class="pad">
      <div id="fwd" class="btn" data-dir="F">&#9650;</div>
      <div id="lft" class="btn" data-dir="L">&#9664;</div>
      <div id="stp" class="btn">STOP</div>
      <div id="rgt" class="btn" data-dir="R">&#9654;</div>
      <div id="bwd" class="btn" data-dir="B">&#9660;</div>
    </div>
  </div>

  <div class="panel">
    <div class="speedhead"><label>SPEED</label><div id="speedVal">170</div></div>
    <input id="speed" type="range" min="0" max="255" value="170">
    <div class="presets">
      <button class="preset" data-v="100">LOW</button>
      <button class="preset" data-v="170">MED</button>
      <button class="preset" data-v="255">MAX</button>
    </div>
  </div>
</div>

<script>
(function(){
  const REPEAT_MS = 300;
  let speed = 170, activeDir = null, timer = null, connected = false;

  const dot = document.getElementById('dot'), stText = document.getElementById('stText');
  const errBox = document.getElementById('err');
  const slider = document.getElementById('speed'), speedVal = document.getElementById('speedVal');
  const presets = document.querySelectorAll('.preset');
  const dirBtns = document.querySelectorAll('.btn[data-dir]');

  function setConn(ok, msg){
    connected = ok;
    dot.classList.toggle('on', ok);
    stText.textContent = ok ? 'Connected' : 'Disconnected';
    if(ok){ errBox.classList.remove('show'); }
    else { errBox.textContent = msg || 'Cannot reach the robot. Check the Wi-Fi connection to OLL_RoboRacer.';
           errBox.classList.add('show'); }
  }

  async function call(path){
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort(), 1500);
    try{
      const r = await fetch(path, {signal: ctrl.signal, cache:'no-store'});
      clearTimeout(to);
      if(!r.ok){
        const t = await r.text();
        setConn(true);
        errBox.textContent = 'Robot error: ' + t; errBox.classList.add('show');
        return false;
      }
      setConn(true);
      return true;
    }catch(e){
      clearTimeout(to);
      setConn(false);
      return false;
    }
  }

  function sendMove(){ if(activeDir) call('/move?dir=' + activeDir + '&speed=' + speed); }

  function startMove(dir, btn){
    if(activeDir === dir) return;
    stopMove(false);
    activeDir = dir;
    btn.classList.add('active');
    sendMove();
    timer = setInterval(sendMove, REPEAT_MS);
  }

  function stopMove(notify){
    if(timer){ clearInterval(timer); timer = null; }
    const was = activeDir;
    activeDir = null;
    dirBtns.forEach(b => b.classList.remove('active'));
    if(was && notify !== false) call('/stop');
  }

  dirBtns.forEach(btn=>{
    const dir = btn.dataset.dir;
    btn.addEventListener('pointerdown', e=>{ e.preventDefault(); btn.setPointerCapture(e.pointerId); startMove(dir, btn); });
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev =>
      btn.addEventListener(ev, e=>{ if(activeDir === dir) stopMove(true); }));
    btn.addEventListener('contextmenu', e=>e.preventDefault());
  });

  document.getElementById('stp').addEventListener('pointerdown', e=>{
    e.preventDefault(); stopMove(false); call('/stop');
  });

  function setSpeed(v, fromPreset){
    speed = Math.max(0, Math.min(255, parseInt(v,10) || 0));
    slider.value = speed; speedVal.textContent = speed;
    presets.forEach(p => p.classList.toggle('sel', parseInt(p.dataset.v,10) === speed));
    if(activeDir) sendMove();
  }
  slider.addEventListener('input', e => setSpeed(e.target.value));
  presets.forEach(p => p.addEventListener('click', ()=> setSpeed(p.dataset.v, true)));

  // Safety: stop when tab hidden / loses focus
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) { stopMove(false); call('/stop'); } });
  window.addEventListener('blur', ()=>{ stopMove(false); call('/stop'); });
  window.addEventListener('pagehide', ()=>{ stopMove(false); call('/stop'); });

  // Keyboard (desktop): arrows / WASD, space = stop
  const keyMap = {ArrowUp:'F',w:'F',W:'F',ArrowDown:'B',s:'B',S:'B',ArrowLeft:'L',a:'L',A:'L',ArrowRight:'R',d:'R',D:'R'};
  const idMap = {F:'fwd',B:'bwd',L:'lft',R:'rgt'};
  window.addEventListener('keydown', e=>{
    if(e.repeat) return;
    if(e.key === ' '){ e.preventDefault(); stopMove(false); call('/stop'); return; }
    const d = keyMap[e.key];
    if(d){ e.preventDefault(); startMove(d, document.getElementById(idMap[d])); }
  });
  window.addEventListener('keyup', e=>{
    const d = keyMap[e.key];
    if(d && activeDir === d) stopMove(true);
  });

  // Connection heartbeat
  setInterval(()=>{ if(!activeDir) call('/ping'); }, 2000);

  setSpeed(170);
  call('/ping');
})();
</script>
</body>
</html>
